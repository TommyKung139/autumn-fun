<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>出團名單 - 中信 2026 秋郊 第二梯</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">秋</div>
      <div>
        <h1>2026 秋郊．第二梯行程查詢</h1>
        <p>8/29（六）｜出團名單</p>
      </div>
    </div>
    <nav class="tabs">
      <a href="/index.html">行程查詢</a>
      <a href="/roster.html">出團名單</a>
      <a href="/info.html">梯次總覽／注意事項</a>
      <a href="#" id="logoutLink">登出</a>
    </nav>
  </header>

  <div class="card">
    <h2>查詢去的人</h2>
    <p class="muted">可依姓名或部門搜尋第二梯確定出團的同仁（不含個人資料，如需查看完整行程請至「行程查詢」輸入員工編號）。</p>
    <div class="search-box">
      <input type="text" id="q" placeholder="輸入姓名或部門關鍵字，例如：陳、策略規劃部" autocomplete="off" />
    </div>
    <p class="hint" id="countHint"></p>
  </div>

  <div class="card">
    <div style="overflow-x:auto;">
      <table id="rosterTable">
        <thead>
          <tr><th>員工編號</th><th>姓名</th><th>處別</th><th>部門</th><th>攜眷</th><th>下午行程</th><th>晚間行程</th><th>桌次</th></tr>
        </thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </div>
  </div>

  <p class="footer-note">資料來源：2026秋郊報名表（第二梯）彙整報名表｜僅顯示已確認參加人員</p>
</div>

<script src="/app.js"></script>
<script>
  let ALL = [];

  (async function init() {
    const ok = await CTBC.requireAuthOrRedirect();
    if (!ok) return;
    CTBC.highlightNav();
    document.getElementById('logoutLink').addEventListener('click', function (e) {
      e.preventDefault();
      CTBC.logout();
    });

    try {
      const res = await CTBC.apiFetch('/api/roster');
      const data = await res.json();
      ALL = data.roster || [];
      render(ALL);
    } catch (err) {
      if (err && err.message === 'unauthorized') return;
    }
  })();

  document.getElementById('q').addEventListener('input', function () {
    const kw = this.value.trim();
    if (!kw) { render(ALL); return; }
    const filtered = ALL.filter((r) =>
      (r.name && r.name.includes(kw)) ||
      (r.department && r.department.includes(kw)) ||
      (r.division && r.division.includes(kw)) ||
      (r.emp_id && r.emp_id.toUpperCase().includes(kw.toUpperCase()))
    );
    render(filtered);
  });

  function render(list) {
    document.getElementById('countHint').textContent = '共 ' + list.length + ' 位（第二梯確認參加總人數，不含眷屬）';
    document.getElementById('rosterBody').innerHTML = list
      .map(
        (r) =>
          '<tr><td>' + r.emp_id + '</td><td>' + r.name + '</td><td>' + (r.division||'') + '</td><td>' + (r.department||'') +
          '</td><td>' + (r.bring_family ? ('是('+r.family_count+')') : '否') + '</td><td>' + (r.afternoon_activity||'') +
          '</td><td>' + (r.evening_activity||'') + '</td><td>' + (r.table||'') + '</td></tr>'
      )
      .join('');
  }
</script>
</body>
</html>
